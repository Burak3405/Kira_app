[project]
name = "kira-app-python"
version = "0.1.0"
description = "Ev sahipleri için mülk, kiracı ve aylık kira ödemesi takip uygulaması (Flask + MySQL)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3",
    "flask-limiter>=4.1.1",
    "flask-login>=0.6.3",
    "flask-sqlalchemy>=3.1.1",
    "flask-wtf>=1.3.0",
    "pymysql>=1.2.0",
    "python-dotenv>=1.2.2",
]
