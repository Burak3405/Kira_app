{% extends 'base.html' %}

{% block title %}Hata {{ hata_kodu }} - Kira Takibi{% endblock %}

{% block content %}
<div class="flex flex-col items-center justify-center min-h-[80vh] px-4">
    <div class="text-center bg-white p-10 rounded-2xl shadow-sm border border-gray-100 max-w-md w-full">
        <div class="text-blue-500 mb-4">
            {% if hata_kodu == 404 %}
                <i class="fa-solid fa-compass text-6xl"></i>
            {% else %}
                <i class="fa-solid fa-triangle-exclamation text-6xl text-red-500"></i>
            {% endif %}
        </div>
        
        <h1 class="text-6xl font-extrabold text-gray-800 mb-2">{{ hata_kodu }}</h1>
        <h2 class="text-xl font-bold text-gray-700 mb-4">Hay aksi! Bir şeyler ters gitti.</h2>
        <p class="text-gray-500 mb-8 text-sm">{{ mesaj }}</p>
        
        <a href="{{ url_for('ana_sayfa') }}" class="bg-blue-600 text-white font-bold py-3 px-6 rounded-xl shadow-md hover:bg-blue-700 transition duration-200">
            <i class="fa-solid fa-house mr-2"></i> Ana Sayfaya Dön
        </a>
    </div>
</div>
{% endblock %}
