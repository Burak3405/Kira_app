<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hata {{ hata_kodu }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 h-screen flex flex-col items-center justify-center font-sans">
    
    <div class="text-center bg-white p-10 rounded-2xl shadow-sm border border-gray-100 max-w-md w-full mx-4">
        <div class="text-blue-500 mb-4">
            {% if hata_kodu == 404 %}
                <i class="fa-solid fa-compass text-6xl"></i>
            {% else %}
                <i class="fa-solid fa-triangle-exclamation text-6xl text-red-500"></i>
            {% endif %}
        </div>
        
        <h1 class="text-6xl font-extrabold text-gray-800 mb-2">{{ hata_kodu }}</h1>
        <h2 class="text-xl font-bold text-gray-700 mb-4">Hay aksi! Bir şeyler ters gitti.</h2>
        <p class="text-gray-500 mb-8 text-sm">{{ mesaj }}</p>
        
        <a href="{{ url_for('ana_sayfa') }}" class="bg-blue-600 text-white font-bold py-3 px-6 rounded-xl shadow-md hover:bg-blue-700 transition duration-200">
            <i class="fa-solid fa-house mr-2"></i> Ana Sayfaya Dön
        </a>
    </div>

</body>
</html>
