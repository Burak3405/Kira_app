{% extends 'base.html' %}

{% block title %}Kiracı Ekle - Kira Takibi{% endblock %}

{% block header %}
<header class="bg-white shadow-sm px-4 py-4 flex items-center sticky top-0 z-10 max-w-5xl mx-auto w-full">
    <a href="{{ url_for('mulk_detayi', id=mulk.id) }}" class="text-gray-500 mr-4 text-xl"><i class="fa-solid fa-arrow-left"></i></a>
    <div>
        <h1 class="text-lg font-bold text-gray-800">Kiracı & Sözleşme Ekle</h1>
        <p class="text-xs text-gray-500">{{ mulk.ad }}</p>
    </div>
</header>
{% endblock %}

{% block content %}
<main class="p-4 mt-2 max-w-5xl mx-auto">
    <form method="POST" class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        
        <h2 class="text-sm font-bold text-blue-600 mb-4 border-b pb-2">Kiracı Bilgileri</h2>
        
        <div class="grid grid-cols-2 gap-4 mb-4">
            <div>
                <label class="block text-sm text-gray-600 mb-1">Ad *</label>
                <input type="text" name="ad" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div>
                <label class="block text-sm text-gray-600 mb-1">Soyad *</label>
                <input type="text" name="soyad" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
        </div>

        <div class="mb-6">
            <label class="block text-sm text-gray-600 mb-1">Telefon</label>
            <input type="tel" name="telefon" placeholder="0 5** *** ** **" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <h2 class="text-sm font-bold text-blue-600 mb-4 border-b pb-2">Sözleşme Bilgileri</h2>

        <div class="mb-4">
            <label class="block text-sm text-gray-600 mb-1">Aylık Kira Bedeli (₺) *</label>
            <input type="number" step="0.01" min="0" name="kira_bedeli" required placeholder="Örn: 25000" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        
        <div class="mb-4">
            <label class="block text-sm text-gray-600 mb-1">Kapora / Depozito <span class="text-gray-400 font-normal">(İsteğe Bağlı)</span></label>
            <input type="text" name="kapora" placeholder="Örn: 2 Kira Bedeli veya 1000 Dolar" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        
        <div class="mb-8">
            <label class="block text-sm text-gray-600 mb-1">Sözleşme Başlangıç Tarihi *</label>
            <input type="date" name="baslangic_tarihi" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-white">
        </div>

        <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-xl shadow-md hover:bg-blue-700 transition">
            Sözleşmeyi Başlat
        </button>
    </form>
</main>
{% endblock %}
