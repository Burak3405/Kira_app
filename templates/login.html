<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap - Kira Takibi</title>
    <!-- TailwindCSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
        <div class="text-center mb-8">
            <i class="fa-solid fa-house-user text-4xl text-blue-600 mb-2"></i>
            <h2 class="text-2xl font-bold text-gray-800">Kira Takibi</h2>
            <p class="text-gray-500 text-sm mt-1">Lütfen hesabınıza giriş yapın</p>
        </div>
        
        <!-- Flask Flash Mesajları (Hata/Başarı) -->
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="mb-4 p-3 rounded text-sm {% if category == 'error' %}bg-red-100 text-red-700 border border-red-200{% elif category == 'success' %}bg-green-100 text-green-700 border border-green-200{% else %}bg-yellow-100 text-yellow-700 border border-yellow-200{% endif %}">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="{{ url_for('login') }}" method="POST">
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="kullanici_adi">
                    Kullanıcı Adı
                </label>
                <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent" id="kullanici_adi" type="text" name="kullanici_adi" placeholder="Kullanıcı adınız" required>
            </div>
            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="sifre">
                    Şifre
                </label>
                <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 mb-3 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent" id="sifre" type="password" name="sifre" placeholder="••••••••" required>
            </div>
            <div class="flex items-center justify-between">
                <button class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded w-full transition duration-200" type="submit">
                    Giriş Yap
                </button>
            </div>
        </form>
        <div class="mt-6 text-center">
            <a href="{{ url_for('register') }}" class="text-sm text-blue-600 hover:text-blue-800 font-semibold transition duration-200">
                Hesabınız yok mu? Yeni Kayıt Oluştur
            </a>
        </div>
    </div>
</body>
</html>
