{% extends 'base.html' %}

{% block title %}Yeni Mülk Ekle - Kira Takibi{% endblock %}

{% block header %}
<header class="bg-white shadow-sm px-4 py-4 flex items-center sticky top-0 z-10 max-w-5xl mx-auto w-full">
    <a href="/" class="text-gray-500 mr-4 text-xl"><i class="fa-solid fa-arrow-left"></i></a>
    <h1 class="text-lg font-bold text-gray-800">Yeni Mülk Ekle</h1>
</header>
{% endblock %}

{% block content %}
<main class="p-4 mt-2 max-w-5xl mx-auto">
    <form action="/mulk/ekle" method="POST" class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        
        <div class="mb-5">
            <label for="ad" class="block text-sm font-semibold text-gray-700 mb-2">Mülk Adı veya Tanımı *</label>
            <input type="text" id="ad" name="ad" required placeholder="Örn: Moda 2+1 Daire" 
                class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
        </div>

        <div class="mb-5">
            <label for="tur" class="block text-sm font-semibold text-gray-700 mb-2">Mülk Türü *</label>
            <div class="relative">
                <select id="tur" name="tur" required 
                    class="w-full px-4 py-3 rounded-lg border border-gray-300 appearance-none focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition bg-white">
                    <option value="" disabled selected>Lütfen seçin...</option>
                    <option value="Ev (Daire)">Ev (Daire)</option>
                    <option value="Dükkan / İş Yeri">Dükkan / İş Yeri</option>
                    <option value="Ofis">Ofis</option>
                    <option value="Müstakil Ev">Müstakil Ev</option>
                    <option value="Arsa">Arsa</option>
                    <option value="Diğer">Diğer</option>
                </select>
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-500">
                    <i class="fa-solid fa-chevron-down text-sm"></i>
                </div>
            </div>
        </div>

        <div class="mb-8">
            <label for="adres" class="block text-sm font-semibold text-gray-700 mb-2">Açık Adres</label>
            <textarea id="adres" name="adres" rows="3" placeholder="Mülkün açık adresi (İsteğe bağlı)" 
                class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition resize-none"></textarea>
        </div>

        <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-xl shadow-md hover:bg-blue-700 hover:shadow-lg transition">
            Mülkü Kaydet
        </button>
        
    </form>
</main>
{% endblock %}
