<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sözleşme Yenile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <header class="bg-white shadow-sm px-4 py-4 flex items-center sticky top-0 z-10">
        <a href="{{ url_for('mulk_detayi', id=eski_sozlesme.mulk_id) }}" class="text-gray-500 mr-4 text-xl"><i class="fa-solid fa-arrow-left"></i></a>
        <div>
            <h1 class="text-lg font-bold text-gray-800">Sözleşmeyi Yenile (Zam)</h1>
            <p class="text-xs text-gray-500">{{ kiraci.ad }} {{ kiraci.soyad }}</p>
        </div>
    </header>

    <main class="p-4 mt-2">
        <div class="bg-blue-50 text-blue-700 p-4 rounded-lg mb-4 text-sm border border-blue-100 shadow-sm">
            <i class="fa-solid fa-circle-info mr-1"></i> Bu işlem mevcut sözleşmeyi geçmişe taşır ve ekrana <strong>yeni kira bedeliyle</strong> yepyeni bir 12 aylık ödeme planı getirir.
        </div>

        <form method="POST" class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            
            <div class="mb-4">
                <label class="block text-sm text-gray-600 mb-1">Eski Kira Bedeli</label>
                <!-- Kullanıcı eski fiyatı değiştiremesin diye disabled yapıyoruz -->
                <input type="text" disabled value="{{ eski_sozlesme.kira_bedeli }} ₺" class="w-full px-3 py-2 border rounded-lg bg-gray-100 text-gray-500 outline-none">
            </div>

            <div class="mb-6">
                <label class="block text-sm font-bold text-gray-700 mb-1">Yeni Aylık Kira Bedeli (₺) *</label>
                <input type="number" step="0.01" min="0" name="kira_bedeli" required placeholder="Yeni zamlı tutar" class="w-full px-3 py-2 border border-blue-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition">
            </div>

            <div class="mb-8">
                <label class="block text-sm text-gray-600 mb-1">Yeni Sözleşme Başlangıç Tarihi *</label>
                <!-- Tarih otomatik olarak tam 1 yıl sonrasına (Bugüne) ayarlı gelir -->
                <input type="date" name="baslangic_tarihi" value="{{ varsayilan_baslangic.strftime('%Y-%m-%d') }}" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-white">
            </div>

            <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-xl shadow-md hover:bg-blue-700 transition">
                Yeni Sözleşmeyi Başlat
            </button>
        </form>
    </main>

</body>
</html>
